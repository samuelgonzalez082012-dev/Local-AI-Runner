name: Package source archive
on:
  push:
    branches:
      - feature/editor-chat-sidebar-customization
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload complete source tree
        uses: actions/upload-artifact@v4
        with:
          name: Local-AI-Runner-Editor-Milestone
          path: |
            .
            !.git/**
            !node_modules/**
            !.github/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
