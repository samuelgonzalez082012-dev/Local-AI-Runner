name: Phase 0-1 validation
on:
  push:
    branches: [feature/phase-0-1-local-first-ux]
  pull_request:
    branches: [main]
permissions:
  contents: read
  checks: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer.js
          node --check work-manager.js
          node --check ux-enhancements.js
          node --check services/work-coordinator.js
          node --check workspace-layout.js
          node --check workspace-openrouter-ui.js
      - name: Run automated tests
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('node:child_process');
            let output = '';
            let failed = false;
            try {
              output = execSync('npm test', { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
            } catch (error) {
              failed = true;
              output = String(error.stdout || '') + '\n' + String(error.stderr || '');
            }
            const checks = await github.rest.checks.listForRef({ owner: context.repo.owner, repo: context.repo.repo, ref: context.sha });
            const current = checks.data.check_runs.find(run => run.name === 'validate' && run.app?.slug === 'github-actions');
            if (current) {
              await github.rest.checks.update({
                owner: context.repo.owner, repo: context.repo.repo, check_run_id: current.id,
                output: { title: 'Automated test output', summary: output.slice(-55000) || 'No test output was captured.' }
              });
            }
            if (failed) core.setFailed('Automated tests failed. See this check run summary for the test output.');
