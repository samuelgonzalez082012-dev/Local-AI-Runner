name: Phase 0-1 validation
on:
  push:
    branches: [feature/phase-0-1-local-first-ux]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer.js
          node --check work-manager.js
          node --check ux-enhancements.js
          node --check services/work-coordinator.js
          node --check workspace-layout.js
          node --check workspace-openrouter-ui.js
      - name: Run automated tests
        run: npm test
